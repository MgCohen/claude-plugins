# ---------------------------------------------------------------- documents
# A document is one output type: fields, page body, and related sections.
# backlink = relation on the section database that points to the root page.

[documents.ask]
database = "asks"
fields = ["Status", "Kind", "Priority", "Source", "Summary", "AI review", "Owner approved", "Skips"]

[[documents.ask.sections]]
title = "Sub-asks"
database = "asks"
backlink = "Parent"
style = "list"
columns = ["Status"]

[documents.project]
database = "projects"
fields = ["Status", "Goal", "Repo"]

[[documents.project.sections]]
title = "Features"
database = "features"
backlink = "Project"
filter = ["Status=!Done"]
columns = ["Key", "Name", "Status", "Kind", "Priority"]

[[documents.project.sections]]
title = "Issues"
database = "issues"
backlink = "Project"
filter = ["Status=!Resolved"]
columns = ["Key", "Name", "Status", "Type", "Severity"]

[[documents.project.sections]]
title = "Docs"
database = "docs"
backlink = "Project"
columns = ["Key", "Name", "Type", "Status"]

[documents.feature]
database = "features"
fields = ["Status", "Kind", "Priority", "Summary", "Acceptance", "PR"]

[[documents.feature.sections]]
title = "Issues"
database = "issues"
backlink = "Feature"
columns = ["Key", "Name", "Status", "Type"]

[[documents.feature.sections]]
title = "Docs"
database = "docs"
backlink = "Features"
columns = ["Key", "Name", "Type", "Status"]

[[documents.feature.sections]]
title = "Snippets"
database = "snippets"
backlink = "Features"
style = "list"
columns = ["Status"]

[documents.issue]
database = "issues"
fields = ["Status", "Type", "Severity", "Summary", "Evidence"]

[[documents.issue.sections]]
title = "Fixes"
database = "fixes"
backlink = "Issues"
columns = ["Key", "Name", "Status", "PR"]

[documents.fix]
database = "fixes"
fields = ["Status", "Summary", "Verify", "PR"]

[[documents.fix.sections]]
title = "Issues"
database = "issues"
backlink = "Fixes"
columns = ["Key", "Name", "Status"]

[documents.doc]
database = "docs"
fields = ["Status", "Type", "Summary"]

[[documents.doc.sections]]
title = "Snippets"
database = "snippets"
backlink = "Docs"
style = "list"
columns = ["Status"]

[documents.session]
database = "sessions"
fields = ["Status", "Agent", "Date", "Link", "Outcome"]

[[documents.session.sections]]
title = "Issues found"
database = "issues"
backlink = "Found in"
columns = ["Key", "Name", "Status"]

[documents.template]
database = "templates"
fields = ["Status", "Target", "Version", "Summary", "Check"]

[[documents.template.sections]]
title = "Issues"
database = "issues"
backlink = "About template"
columns = ["Key", "Name", "Status"]

[documents.snippet]
database = "snippets"
fields = ["Status", "File", "Method", "Start line", "End line", "Region", "Message"]
