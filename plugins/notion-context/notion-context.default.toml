# ---------------------------------------------------------------- documents
# A document is one output type: fields, page body, and related sections.
# backlink = relation on the section database that points to the root page.

[documents.ask]
database = "asks"
fields = ["Status", "Kind", "Priority", "Source", "Summary", "AI review", "Owner approved", "Skips"]

[[documents.ask.sections]]
title = "Sub-asks"
database = "asks"
backlink = "Parent"
style = "list"
columns = ["Status"]

[documents.question]
database = "questions"
fields = ["Status", "Context", "Answer", "Asked by", "Blocks"]

[[documents.question.sections]]
title = "Decision"
database = "decisions"
backlink = "Questions"
columns = ["Key", "Name", "Status", "Decision"]

[documents.project]
database = "projects"
fields = ["Status", "Goal", "Repo"]

[[documents.project.sections]]
title = "Features"
database = "features"
backlink = "Project"
filter = ["Status=!Done"]
columns = ["Key", "Name", "Status", "Kind", "Priority"]

[[documents.project.sections]]
title = "Bugs"
database = "bugs"
backlink = "Project"
filter = ["Status=!Resolved"]
columns = ["Key", "Name", "Status", "Area", "Severity"]

[[documents.project.sections]]
title = "Decisions"
database = "decisions"
backlink = "Project"
columns = ["Key", "Name", "Status", "Decision"]

[[documents.project.sections]]
