# notion-context default layer: the Workflow workspace of MgCohen.
# Each later layer overrides keys of this file. Layers, lowest first:
#   this file, ~/.claude/notion-context.toml, $CLAUDE_PROJECT_DIR/notion-context.toml,
#   ./notion-context.toml, $NOTION_CONTEXT_CONFIG, --config.
# To use a different workspace, override the ids in your own layer. See notion-context.example.toml.
# Run `notion-context pointers` to see each name, its id and its layer.
# Run `notion-context check` after each change in Notion or in a layer.

[settings]
child_databases = "link"   # inline databases in a page body: skip | link | rows
max_depth = 3              # how deep "full" sections can nest

# ----------------------------------------------------------------- pointers
# name = Notion page id. Skills and tools use the name, not the id.

[pointers]
workflow = "40e91e24578681b5a046c0d425a39b66"         # root page; give integration access here
spikes = "40e91e24578681189b23cd623f183589"
workflow-guide = "40e91e24578681579203cf60739c0c3f"   # DOC: flow, templates, improvement loop
triage-rules = "40e91e24578681d0b819cdec82c8613c"     # DOC: stages, queue, exit steps
triage-kinds = "40e91e24578681c88c47ffb3523742f1"     # DOC: kinds, sections, exits, review

# ---------------------------------------------------------------- databases
# alias = database id, data source id (for the Notion MCP), unique_id property.
# A database alias is also a pointer: `asks` gives the id, `asks.source` the data source.

[databases.asks]
id = "8e1610390d364811a150fc4053e50d79"
source = "collection://fb8adbbb-9cc8-4c79-a2b1-ff0bc9cb71b0"
key = "Key"
document = "ask"

