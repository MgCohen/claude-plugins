# Example override layer. Copy it to ~/.claude/notion-context.toml (for one user)
# or to <project>/notion-context.toml (for one project). Keep only the keys you change:
# each key here overrides the same key of the plugin default, notion-context.default.toml.

# Point a name at a different page.
[pointers]
workflow = "00000000000000000000000000000000"

# Point a database alias at a copy in a different workspace.
[databases.asks]
id = "00000000000000000000000000000000"
source = "collection://00000000-0000-0000-0000-000000000000"

# Add a database and a document that only this user or project uses.
# [databases.notes]
# id = "00000000000000000000000000000000"
# key = "Key"
# document = "note"
#
# [documents.note]
# database = "notes"
# fields = ["Status"]
